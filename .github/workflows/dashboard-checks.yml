name: Dashboard and pipeline checks

on:
  pull_request:
    paths:
      - '.github/workflows/dashboard-checks.yml'
      - 'assets/**'
      - 'dashboards/**'
      - 'index.html'
      - 'src/**'
      - 'et-channelers/**'
      - 'channeling-atlas/dist/**'
      - 'channeling-atlas/research/analysis/build_report.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: et-channelers
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify changed paths
        id: changes
        env:
          CHANGE_EVENT: ${{ github.event_name }}
          CHANGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.run(
                  ['git', *args], check=True, capture_output=True, timeout=45
              ).stdout

          run_python, reason = True, 'non_pull_request'
          if os.environ.get('CHANGE_EVENT') == 'pull_request':
              try:
                  base = os.environ.get('CHANGE_BASE_SHA', '')
                  head = git('rev-parse', '--verify', 'HEAD^{commit}').decode('ascii').strip()
                  if not all(re.fullmatch(r'[0-9a-fA-F]{40}', sha) for sha in (base, head)):
                      raise ValueError('invalid commit identity')
                  try:
                      git('cat-file', '-e', base + '^{commit}')
                  except subprocess.CalledProcessError:
                      git('fetch', '--no-tags', '--depth=1', 'origin', base)
                      git('cat-file', '-e', base + '^{commit}')
                  paths = git('diff', '--no-ext-diff', '--no-renames', '--name-only', '-z', base, head, '--').split(b'\0')
                  paths = [path for path in paths if path]
                  generated = {b'et-channelers/plan/' + name for name in (
                      b'ingestion_status.json', b'collection_eta.json', b'channel_download_coverage.json',
                      b'channel_download_coverage.csv', b'downloaded_videos.csv')}
                  docs_only = bool(paths) and all(
                      path.endswith(b'.md') or path in generated
                      for path in paths
                  )
                  run_python = not docs_only
                  reason = 'documentation_or_collection_snapshot_only' if docs_only else 'code_or_empty_diff'
              except Exception:
                  run_python, reason = True, 'diff_unavailable'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('run_python=' + str(run_python).lower() + '\n')
          print('Full Python suite: ' + str(run_python).lower() + ' (' + reason + ')')
          PY
      - name: Full standard-library pipeline test suite
        if: ${{ !cancelled() && steps.changes.outputs.run_python != 'false' }}
        run: python -m unittest discover -s et-channelers/pipeline/tests -v
      - name: Public media and credential guard
        run: python et-channelers/scripts/guard_no_raw_media.py
      - name: Published count consistency
        run: python et-channelers/scripts/check_counts.py
      - name: Collection snapshot consistency
        run: python et-channelers/scripts/check_collection_snapshot.py
      - name: Dashboard JavaScript syntax
        run: |
          node --check assets/research-nav.js
          node --check dashboards/hub.js
          node --check channeling-atlas/dist/app.js
      - name: Native audio adapter and Chrome extension offline contracts
        run: node --test et-channelers/browser_capture_extension/tests/*.test.mjs et-channelers/pipeline/tests/test_browser_sabr_adapter.mjs
